[env:note4c]
; Pinned to the versions the firmware was built and hardware-tested with
; (Arduino-ESP32 2.0.17 / IDF 4.4). Newer platforms switch to Arduino 3.x.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFIRMWARE_VERSION='"dev"'
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    https://github.com/tzapu/WiFiManager.git#4131fe617d01d746677e8b909379597162c2ca58
monitor_speed = 115200

[env:note4c-diag]
extends = env:note4c
build_flags =
    ${env:note4c.build_flags}
    -DDIAG_TEST_PATTERN

[env:sim]
platform = native
build_flags = -std=c++17
build_src_filter = -<*> +<../tools/sim/sim.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=c++17
lib_deps =
    bblanchon/ArduinoJson@^7
